upstream logpilot_api {
    server api-gateway:8000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self' data:" always;

    location = /healthz { access_log off; return 200 "ok"; }

    # API (REST) - long timeouts and no request buffering so 500MB log uploads stream straight through
    location /api/ {
        client_max_body_size 520m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://logpilot_api;
    }

    # real-time channel
    location /ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_pass http://logpilot_api;
    }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    # single-page app
    location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
}
