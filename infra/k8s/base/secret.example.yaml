# TEMPLATE ONLY - not part of kustomization.yaml. Create the real secret from your secret manager
# (External Secrets Operator / AWS Secrets Manager CSI), for example:
#   kubectl -n logpilot create secret generic logpilot-secrets --from-env-file=prod.secrets.env
apiVersion: v1
kind: Secret
metadata:
  name: logpilot-secrets
  namespace: logpilot
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg2://logpilot:REPLACE@REPLACE-rds-endpoint:5432/logpilot?sslmode=require
  JWT_SECRET: REPLACE-32-plus-random-bytes
  INTERNAL_API_TOKEN: REPLACE-32-plus-random-bytes
  AI_API_KEY: REPLACE
  QDRANT_API_KEY: REPLACE
  S3_ACCESS_KEY: ""   # empty on AWS: credentials come from IRSA
  S3_SECRET_KEY: ""
  BOOTSTRAP_ADMIN_EMAIL: admin@example.com
  BOOTSTRAP_ADMIN_PASSWORD: REPLACE
