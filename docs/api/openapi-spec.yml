components:
  schemas:
    ApiRecord:
      properties:
        timestamp:
          anyOf:
          - type: string
          - type: number
          - type: integer
          - type: 'null'
          title: Timestamp
        message:
          type: string
          title: Message
        severity:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
        level:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
        service:
          anyOf:
          - type: string
          - type: 'null'
          title: Service
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        environment:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
        deployment_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Deployment Version
        attributes:
          additionalProperties: true
          type: object
          title: Attributes
      type: object
      required:
      - message
      title: ApiRecord
    ChatBody:
      properties:
        message:
          type: string
          maxLength: 4000
          minLength: 1
          title: Message
        thread_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Thread Id
      type: object
      required:
      - message
      title: ChatBody
    CreateUser:
      properties:
        email:
          type: string
          title: Email
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          maxLength: 128
          minLength: 10
          title: Password
        project_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Project Ids
          default: []
      type: object
      required:
      - email
      - name
      - role
      - password
      title: CreateUser
    DeployBody:
      properties:
        service:
          type: string
          maxLength: 200
          minLength: 1
          title: Service
        version:
          type: string
          maxLength: 100
          minLength: 1
          title: Version
        environment:
          type: string
          title: Environment
          default: production
        deployed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deployed At
      type: object
      required:
      - service
      - version
      title: DeployBody
    ExecBody:
      properties:
        days:
          type: integer
          maximum: 90.0
          minimum: 1.0
          title: Days
          default: 7
      type: object
      title: ExecBody
    ExplainBody:
      properties:
        message:
          type: string
          maxLength: 2000
          minLength: 1
          title: Message
        service:
          anyOf:
          - type: string
          - type: 'null'
          title: Service
        severity:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
      type: object
      required:
      - message
      title: ExplainBody
    ForecastSettings:
      properties:
        warning_threshold:
          type: integer
          maximum: 99.0
          minimum: 1.0
          title: Warning Threshold
        critical_threshold:
          type: integer
          maximum: 100.0
          minimum: 2.0
          title: Critical Threshold
        interval_seconds:
          type: integer
          maximum: 3600.0
          minimum: 10.0
          title: Interval Seconds
        window_seconds:
          type: integer
          maximum: 600.0
          minimum: 10.0
          title: Window Seconds
          default: 60
      type: object
      required:
      - warning_threshold
      - critical_threshold
      - interval_seconds
      title: ForecastSettings
    GuidedBody:
      properties:
        enabled:
          type: boolean
          title: Enabled
      type: object
      required:
      - enabled
      title: GuidedBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IncidentBody:
      properties:
        service:
          anyOf:
          - type: string
          - type: 'null'
          title: Service
        cluster_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Cluster Id
        rca_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Rca Id
        alert_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Alert Id
        start:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start
        end:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End
      type: object
      title: IncidentBody
    LoginBody:
      properties:
        email:
          type: string
          title: Email
        password:
          type: string
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginBody
    OutcomeBody:
      properties:
        outcome:
          type: string
          enum:
          - prevented
          - occurred
          - false_positive
          title: Outcome
        action_taken:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Action Taken
        time_to_resolve_minutes:
          anyOf:
          - type: number
            maximum: 100000.0
            minimum: 0.0
          - type: 'null'
          title: Time To Resolve Minutes
        notes:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Notes
      type: object
      required:
      - outcome
      title: OutcomeBody
    PasswordBody:
      properties:
        current_password:
          type: string
          title: Current Password
        new_password:
          type: string
          maxLength: 128
          minLength: 10
          title: New Password
      type: object
      required:
      - current_password
      - new_password
      title: PasswordBody
    PolicyBody:
      properties:
        scope:
          type: string
          title: Scope
          default: '*'
        tier:
          type: string
          enum:
          - read_only
          - autonomous_background
          - autonomous_policy_bounded
          - propose_only
          - autonomous_execution
          title: Tier
        min_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Confidence
          default: 0.0
        requires_approval:
          type: boolean
          title: Requires Approval
          default: false
        enabled:
          type: boolean
          title: Enabled
          default: true
      type: object
      required:
      - tier
      title: PolicyBody
    ProjectBody:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        environment:
          type: string
          title: Environment
          default: production
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - name
      title: ProjectBody
    RatingBody:
      properties:
        rating:
          type: integer
          enum:
          - 1
          - -1
          title: Rating
      type: object
      required:
      - rating
      title: RatingBody
    RcaBody:
      properties:
