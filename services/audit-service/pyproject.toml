[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logpilot-audit-service"
version = "2.0.0"
description = "Audit log: hash-chained events, agent-action audit, export, reversal"
requires-python = ">=3.11"
# shared library (models, config, utils) is installed separately from ../../shared
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
